[tool.poetry]
name = "ipl-backend"
version = "1.0.0"
description = "IPL Analysis Backend API"
authors = ["Munna Kumar <munna@example.com>"]

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "0.115.6"
uvicorn = {extras = ["standard"], version = "0.32.1"}
pandas = "2.2.3"
pydantic = "2.10.4"
python-multipart = "0.0.19"
python-dotenv = "1.0.1"
requests = "2.32.3"
numpy = "2.1.3"
scikit-learn = "1.5.2"
matplotlib = "3.9.2"
seaborn = "0.13.2"
plotly = "5.24.1"
openpyxl = "3.1.5"
xlrd = "2.0.1"
aiofiles = "24.1.0"
Pillow = "11.0.0"

[tool.poetry.group.dev.dependencies]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"