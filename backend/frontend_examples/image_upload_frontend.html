<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL Player Image Upload</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1em;
        }

        .content {
            padding: 40px;
        }

        .upload-section {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 30px;
            margin-bottom: 30px;
            border: 2px dashed #dee2e6;
            transition: all 0.3s ease;
        }

        .upload-section:hover {
            border-color: #007bff;
            background: #e3f2fd;
        }

        .upload-section.dragover {
            border-color: #28a745;
            background: #d4edda;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #007bff;
        }

        .file-input-wrapper {
            position: relative;
            display: inline-block;
            width: 100%;
        }

        .file-input {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        .file-input-label {
            display: block;
            padding: 20px;
            background: #007bff;
            color: white;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: background 0.3s ease;
            font-size: 16px;
            font-weight: 600;
        }

        .file-input-label:hover {
            background: #0056b3;
        }

        .btn {
            background: #28a745;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }

        .btn:hover {
            background: #218838;
            transform: translateY(-2px);
        }

        .btn:disabled {
            background: #6c757d;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #6c757d;
        }

        .btn-secondary:hover {
            background: #545b62;
        }

        .preview-section {
            margin-top: 30px;
            text-align: center;
        }

        .image-preview {
            max-width: 200px;
            max-height: 200px;
            border-radius: 10px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            margin: 20px auto;
            display: none;
        }

        .status-message {
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            font-weight: 600;
            display: none;
        }

        .status-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .player-list {
            margin-top: 30px;
        }

        .player-item {
            display: flex;
            align-items: center;
            padding: 15px;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            margin-bottom: 10px;
            background: white;
            transition: all 0.3s ease;
        }

        .player-item:hover {
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transform: translateY(-2px);
        }

        .player-image {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 15px;
            border: 2px solid #dee2e6;
        }

        .player-info {
            flex: 1;
        }

        .player-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .player-id {
            color: #6c757d;
            font-size: 14px;
        }

        .upload-btn {
            background: #17a2b8;
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s ease;
        }

        .upload-btn:hover {
            background: #138496;
        }

        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #007bff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .stat-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid #dee2e6;
        }

        .stat-number {
            font-size: 2em;
            font-weight: bold;
            color: #007bff;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #6c757d;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏏 IPL Player Image Upload</h1>
            <p>Upload and manage player images permanently</p>
        </div>

        <div class="content">
            <!-- Image Upload Section -->
            <div class="upload-section" id="uploadSection">
                <h3>📸 Upload Player Image</h3>
                <form id="uploadForm">
                    <div class="form-group">
                        <label for="playerId">Select Player:</label>
                        <select id="playerId" name="player_id" required>
                            <option value="">Choose a player...</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Upload Image:</label>
                        <div class="file-input-wrapper">
                            <input type="file" id="imageFile" class="file-input" accept="image/*" required>
                            <label for="imageFile" class="file-input-label">
                                📁 Choose Image File
                            </label>
                        </div>
                    </div>

                    <button type="submit" class="btn" id="uploadBtn">
                        🚀 Upload Image
                    </button>
                </form>

                <div class="preview-section">
                    <img id="imagePreview" class="image-preview" alt="Preview">
                </div>

                <div id="statusMessage" class="status-message"></div>
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <p>Uploading image...</p>
                </div>
            </div>

            <!-- Player List Section -->
            <div class="player-list">
                <h3>👥 Players List</h3>
                <div id="playersContainer">
                    <p>Loading players...</p>
                </div>
            </div>

            <!-- Stats Section -->
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-number" id="totalPlayers">0</div>
                    <div class="stat-label">Total Players</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="playersWithImages">0</div>
                    <div class="stat-label">Players with Images</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="playersWithoutImages">0</div>
                    <div class="stat-label">Players without Images</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000';
        let players = [];

        // Load players on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadPlayers();
            setupEventListeners();
        });

        function setupEventListeners() {
            // File input change
            document.getElementById('imageFile').addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    previewImage(file);
                }
            });

            // Form submit
            document.getElementById('uploadForm').addEventListener('submit', function(e) {
                e.preventDefault();
                uploadImage();
            });

            // Drag and drop
            const uploadSection = document.getElementById('uploadSection');
            uploadSection.addEventListener('dragover', function(e) {
                e.preventDefault();
                uploadSection.classList.add('dragover');
            });

            uploadSection.addEventListener('dragleave', function(e) {
                e.preventDefault();
                uploadSection.classList.remove('dragover');
            });

            uploadSection.addEventListener('drop', function(e) {
                e.preventDefault();
                uploadSection.classList.remove('dragover');
                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    document.getElementById('imageFile').files = files;
                    previewImage(files[0]);
                }
            });
        }

        async function loadPlayers() {
            try {
                const response = await fetch(`${API_BASE}/players`);
                const data = await response.json();
                players = data;
                
                populatePlayerSelect();
                renderPlayers();
                updateStats();
            } catch (error) {
                console.error('Error loading players:', error);
                showStatus('Error loading players', 'error');
            }
        }

        function populatePlayerSelect() {
            const select = document.getElementById('playerId');
            select.innerHTML = '<option value="">Choose a player...</option>';
            
            players.forEach(player => {
                const option = document.createElement('option');
                option.value = player.player_id;
                option.textContent = `${player.player_name} (ID: ${player.player_id})`;
                select.appendChild(option);
            });
        }

        function renderPlayers() {
            const container = document.getElementById('playersContainer');
            container.innerHTML = '';

            players.slice(0, 20).forEach(player => {
                const playerDiv = document.createElement('div');
                playerDiv.className = 'player-item';
                
                const avatarUrl = `${API_BASE}${player.avatar_url}`;
                
                playerDiv.innerHTML = `
                    <img src="${avatarUrl}" class="player-image" 
                         onerror="this.src='https://via.placeholder.com/50x50?text=No+Image'">
                    <div class="player-info">
                        <div class="player-name">${player.player_name}</div>
                        <div class="player-id">ID: ${player.player_id}</div>
                    </div>
                    <button class="upload-btn" onclick="selectPlayer(${player.player_id})">
                        Upload Image
                    </button>
                `;
                
                container.appendChild(playerDiv);
            });
        }

        function selectPlayer(playerId) {
            document.getElementById('playerId').value = playerId;
            document.getElementById('uploadSection').scrollIntoView({ behavior: 'smooth' });
        }

        function previewImage(file) {
            const preview = document.getElementById('imagePreview');
            const reader = new FileReader();
            
            reader.onload = function(e) {
                preview.src = e.target.result;
                preview.style.display = 'block';
            };
            
            reader.readAsDataURL(file);
        }

        async function uploadImage() {
            const formData = new FormData();
            const playerId = document.getElementById('playerId').value;
            const imageFile = document.getElementById('imageFile').files[0];

            if (!playerId || !imageFile) {
                showStatus('Please select a player and image file', 'error');
                return;
            }

            formData.append('player_id', playerId);
            formData.append('file', imageFile);

            showLoading(true);
            hideStatus();

            try {
                const response = await fetch(`${API_BASE}/update-player-image`, {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (result.success) {
                    showStatus(`✅ Image uploaded successfully for ${getPlayerName(playerId)}!`, 'success');
                    
                    // Update player in local array
                    const playerIndex = players.findIndex(p => p.player_id == playerId);
                    if (playerIndex !== -1) {
                        players[playerIndex].player_image = result.image_url;
                    }
                    
                    // Refresh display
                    renderPlayers();
                    updateStats();
                    
                    // Reset form
                    document.getElementById('uploadForm').reset();
                    document.getElementById('imagePreview').style.display = 'none';
                } else {
                    showStatus('❌ Upload failed: ' + result.message, 'error');
                }
            } catch (error) {
                console.error('Upload error:', error);
                showStatus('❌ Upload failed: ' + error.message, 'error');
            } finally {
                showLoading(false);
            }
        }

        function getPlayerName(playerId) {
            const player = players.find(p => p.player_id == playerId);
            return player ? player.player_name : 'Unknown Player';
        }

        function updateStats() {
            const total = players.length;
            const withImages = players.filter(p => p.player_image && p.player_image.trim()).length;
            const withoutImages = total - withImages;

            document.getElementById('totalPlayers').textContent = total;
            document.getElementById('playersWithImages').textContent = withImages;
            document.getElementById('playersWithoutImages').textContent = withoutImages;
        }

        function showStatus(message, type) {
            const statusDiv = document.getElementById('statusMessage');
            statusDiv.textContent = message;
            statusDiv.className = `status-message status-${type}`;
            statusDiv.style.display = 'block';

            if (type === 'success') {
                setTimeout(() => hideStatus(), 5000);
            }
        }

        function hideStatus() {
            document.getElementById('statusMessage').style.display = 'none';
        }

        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
            document.getElementById('uploadBtn').disabled = show;
        }
    </script>
</body>
</html>
