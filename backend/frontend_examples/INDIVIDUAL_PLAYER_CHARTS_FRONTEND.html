<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Individual Player Performance Charts - IPL Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            color: #2c3e50;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .header p {
            color: #7f8c8d;
            font-size: 1.1rem;
        }

        .search-section {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        }

        .search-row {
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        .search-group {
            flex: 1;
            min-width: 200px;
        }

        .search-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2c3e50;
        }

        .search-group input, .search-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .search-group input:focus, .search-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .charts-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 30px;
            margin-top: 30px;
        }

        .chart-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        .chart-card:hover {
            transform: translateY(-5px);
        }

        .chart-card h3 {
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 1.3rem;
            text-align: center;
            border-bottom: 2px solid #f8f9fa;
            padding-bottom: 10px;
        }

        .chart-container {
            position: relative;
            height: 400px;
            margin-bottom: 20px;
        }

        .player-info {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
            text-align: center;
        }

        .player-info h2 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .player-info p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #7f8c8d;
            font-size: 1.2rem;
        }

        .error {
            background: #e74c3c;
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: center;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .stat-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            border-left: 4px solid #667eea;
        }

        .stat-item .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #2c3e50;
        }

        .stat-item .stat-label {
            font-size: 0.9rem;
            color: #7f8c8d;
            margin-top: 5px;
        }

        @media (max-width: 768px) {
            .search-row {
                flex-direction: column;
            }
            
            .charts-container {
                grid-template-columns: 1fr;
            }
            
            .container {
                padding: 20px;
            }
            
            .header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏏 Individual Player Performance Charts</h1>
            <p>Analyze player performance across seasons with detailed statistics</p>
        </div>

        <div class="search-section">
            <div class="search-row">
                <div class="search-group">
                    <label for="playerName">Player Name:</label>
                    <input type="text" id="playerName" placeholder="Enter player name (e.g., V Kohli, JJ Bumrah)" value="V Kohli">
                </div>
                <div class="search-group">
                    <label for="chartType">Chart Type:</label>
                    <select id="chartType">
                        <option value="batting">Batting Performance</option>
                        <option value="bowling">Bowling Performance</option>
                        <option value="both">Both Batting & Bowling</option>
                    </select>
                </div>
                <div class="search-group">
                    <button class="btn" onclick="loadPlayerCharts()">📊 Load Charts</button>
                </div>
            </div>
        </div>

        <div id="playerInfo" class="player-info" style="display: none;">
            <h2 id="playerNameDisplay"></h2>
            <p id="playerStats"></p>
        </div>

        <div id="loading" class="loading" style="display: none;">
            <p>🔄 Loading player data...</p>
        </div>

        <div id="error" class="error" style="display: none;">
            <p id="errorMessage"></p>
        </div>

        <div id="chartsContainer" class="charts-container"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000';

        async function loadPlayerCharts() {
            const playerName = document.getElementById('playerName').value.trim();
            const chartType = document.getElementById('chartType').value;
            
            if (!playerName) {
                showError('Please enter a player name');
                return;
            }

            showLoading();
            hideError();
            clearCharts();

            try {
                const charts = [];
                
                if (chartType === 'batting' || chartType === 'both') {
                    const battingData = await fetchPlayerBattingData(playerName);
                    if (battingData) {
                        charts.push(createBattingChart(battingData));
                        charts.push(createBattingStatsChart(battingData));
                    }
                }
                
                if (chartType === 'bowling' || chartType === 'both') {
                    const bowlingData = await fetchPlayerBowlingData(playerName);
                    if (bowlingData) {
                        charts.push(createBowlingChart(bowlingData));
                        charts.push(createBowlingStatsChart(bowlingData));
                    }
                }

                if (charts.length === 0) {
                    showError('No data found for this player');
                    return;
                }

                displayCharts(charts);
                showPlayerInfo(playerName, charts);

            } catch (error) {
                console.error('Error loading charts:', error);
                showError('Failed to load player data: ' + error.message);
            } finally {
                hideLoading();
            }
        }

        async function fetchPlayerBattingData(playerName) {
            const response = await fetch(`${API_BASE}/charts/line/player-batting-seasons/${encodeURIComponent(playerName)}`);
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}: ${response.statusText}`);
            }
            return await response.json();
        }

        async function fetchPlayerBowlingData(playerName) {
            const response = await fetch(`${API_BASE}/charts/line/player-bowling-seasons/${encodeURIComponent(playerName)}`);
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}: ${response.statusText}`);
            }
            return await response.json();
        }

        function createBattingChart(data) {
            const ctx = document.createElement('canvas');
            ctx.id = 'battingChart';
            
            return {
                title: `${data.player_name} - Runs Over Seasons`,
                canvas: ctx,
                config: {
                    type: 'line',
                    data: {
                        labels: data.seasons,
                        datasets: [{
                            label: 'Runs',
                            data: data.runs,
                            borderColor: '#667eea',
                            backgroundColor: 'rgba(102, 126, 234, 0.1)',
                            borderWidth: 3,
                            fill: true,
                            tension: 0.4,
                            pointBackgroundColor: '#667eea',
                            pointBorderColor: '#fff',
                            pointBorderWidth: 2,
                            pointRadius: 6,
                            pointHoverRadius: 8
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            title: {
                                display: true,
                                text: 'Runs Scored Over Seasons',
                                font: { size: 16, weight: 'bold' }
                            },
                            legend: {
                                display: true,
                                position: 'top'
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                title: {
                                    display: true,
                                    text: 'Runs'
                                },
                                grid: {
                                    color: 'rgba(0,0,0,0.1)'
                                }
                            },
                            x: {
                                title: {
                                    display: true,
                                    text: 'Season'
                                },
                                grid: {
                                    color: 'rgba(0,0,0,0.1)'
                                }
                            }
                        },
                        interaction: {
                            intersect: false,
                            mode: 'index'
                        }
                    }
                }
            };
        }

        function createBattingStatsChart(data) {
            const ctx = document.createElement('canvas');
            ctx.id = 'battingStatsChart';
            
            return {
                title: `${data.player_name} - Batting Statistics`,
                canvas: ctx,
                config: {
                    type: 'bar',
                    data: {
                        labels: data.seasons,
                        datasets: [
                            {
                                label: 'Fours',
                                data: data.fours,
                                backgroundColor: 'rgba(52, 152, 219, 0.8)',
                                borderColor: '#3498db',
                                borderWidth: 1
                            },
                            {
                                label: 'Sixes',
                                data: data.sixes,
                                backgroundColor: 'rgba(231, 76, 60, 0.8)',
                                borderColor: '#e74c3c',
                                borderWidth: 1
                            },
                            {
                                label: 'Strike Rate',
                                data: data.strike_rate,
                                backgroundColor: 'rgba(46, 204, 113, 0.8)',
                                borderColor: '#2ecc71',
                                borderWidth: 1,
                                yAxisID: 'y1'
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            title: {
                                display: true,
                                text: 'Boundaries and Strike Rate',
                                font: { size: 16, weight: 'bold' }
                            }
                        },
                        scales: {
                            y: {
                                type: 'linear',
                                display: true,
                                position: 'left',
                                title: {
                                    display: true,
                                    text: 'Boundaries'
                                }
                            },
                            y1: {
                                type: 'linear',
                                display: true,
                                position: 'right',
                                title: {
                                    display: true,
                                    text: 'Strike Rate'
                                },
                                grid: {
                                    drawOnChartArea: false,
                                },
                            },
                            x: {
                                title: {
                                    display: true,
                                    text: 'Season'
                                }
                            }
                        }
                    }
                }
            };
        }

        function createBowlingChart(data) {
            const ctx = document.createElement('canvas');
            ctx.id = 'bowlingChart';
            
            return {
                title: `${data.player_name} - Wickets Over Seasons`,
                canvas: ctx,
                config: {
                    type: 'line',
                    data: {
                        labels: data.seasons,
                        datasets: [{
                            label: 'Wickets',
                            data: data.wickets,
                            borderColor: '#e74c3c',
                            backgroundColor: 'rgba(231, 76, 60, 0.1)',
                            borderWidth: 3,
                            fill: true,
                            tension: 0.4,
                            pointBackgroundColor: '#e74c3c',
                            pointBorderColor: '#fff',
                            pointBorderWidth: 2,
                            pointRadius: 6,
                            pointHoverRadius: 8
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            title: {
                                display: true,
                                text: 'Wickets Taken Over Seasons',
                                font: { size: 16, weight: 'bold' }
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                title: {
                                    display: true,
                                    text: 'Wickets'
                                }
                            },
                            x: {
                                title: {
                                    display: true,
                                    text: 'Season'
                                }
                            }
                        }
                    }
                }
            };
        }

        function createBowlingStatsChart(data) {
            const ctx = document.createElement('canvas');
            ctx.id = 'bowlingStatsChart';
            
            return {
                title: `${data.player_name} - Bowling Statistics`,
                canvas: ctx,
                config: {
                    type: 'bar',
                    data: {
                        labels: data.seasons,
                        datasets: [
                            {
                                label: 'Economy',
                                data: data.economy,
                                backgroundColor: 'rgba(155, 89, 182, 0.8)',
                                borderColor: '#9b59b6',
                                borderWidth: 1,
                                yAxisID: 'y1'
                            },
                            {
                                label: 'Average',
                                data: data.average,
                                backgroundColor: 'rgba(52, 73, 94, 0.8)',
                                borderColor: '#34495e',
                                borderWidth: 1,
                                yAxisID: 'y1'
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            title: {
                                display: true,
                                text: 'Economy and Bowling Average',
                                font: { size: 16, weight: 'bold' }
                            }
                        },
                        scales: {
                            y: {
                                type: 'linear',
                                display: true,
                                position: 'left',
                                title: {
                                    display: true,
                                    text: 'Wickets'
                                }
                            },
                            y1: {
                                type: 'linear',
                                display: true,
                                position: 'right',
                                title: {
                                    display: true,
                                    text: 'Economy/Average'
                                },
                                grid: {
                                    drawOnChartArea: false,
                                },
                            },
                            x: {
                                title: {
                                    display: true,
                                    text: 'Season'
                                }
                            }
                        }
                    }
                }
            };
        }

        function displayCharts(charts) {
            const container = document.getElementById('chartsContainer');
            
            charts.forEach(chart => {
                const chartCard = document.createElement('div');
                chartCard.className = 'chart-card';
                
                const title = document.createElement('h3');
                title.textContent = chart.title;
                chartCard.appendChild(title);
                
                const chartContainer = document.createElement('div');
                chartContainer.className = 'chart-container';
                chartContainer.appendChild(chart.canvas);
                chartCard.appendChild(chartContainer);
                
                container.appendChild(chartCard);
                
                // Create the chart
                new Chart(chart.canvas, chart.config);
            });
        }

        function showPlayerInfo(playerName, charts) {
            const playerInfo = document.getElementById('playerInfo');
            const playerNameDisplay = document.getElementById('playerNameDisplay');
            const playerStats = document.getElementById('playerStats');
            
            playerNameDisplay.textContent = playerName;
            
            // Calculate some basic stats
            let totalSeasons = 0;
            let totalRuns = 0;
            let totalWickets = 0;
            
            charts.forEach(chart => {
                if (chart.config.data.datasets[0].label === 'Runs') {
                    totalRuns = chart.config.data.datasets[0].data.reduce((a, b) => a + b, 0);
                    totalSeasons = chart.config.data.labels.length;
                }
                if (chart.config.data.datasets[0].label === 'Wickets') {
                    totalWickets = chart.config.data.datasets[0].data.reduce((a, b) => a + b, 0);
                }
            });
            
            let statsText = `Seasons: ${totalSeasons}`;
            if (totalRuns > 0) statsText += ` | Total Runs: ${totalRuns}`;
            if (totalWickets > 0) statsText += ` | Total Wickets: ${totalWickets}`;
            
            playerStats.textContent = statsText;
            playerInfo.style.display = 'block';
        }

        function showLoading() {
            document.getElementById('loading').style.display = 'block';
        }

        function hideLoading() {
            document.getElementById('loading').style.display = 'none';
        }

        function showError(message) {
            const errorDiv = document.getElementById('error');
            const errorMessage = document.getElementById('errorMessage');
            errorMessage.textContent = message;
            errorDiv.style.display = 'block';
        }

        function hideError() {
            document.getElementById('error').style.display = 'none';
        }

        function clearCharts() {
            document.getElementById('chartsContainer').innerHTML = '';
            document.getElementById('playerInfo').style.display = 'none';
        }

        // Load default player on page load
        window.addEventListener('load', () => {
            loadPlayerCharts();
        });
    </script>
</body>
</html>
