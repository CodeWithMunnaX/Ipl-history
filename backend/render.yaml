services:
  - type: web
    name: ipl-backend
    env: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
    disk:
      name: player-images
      mountPath: /opt/render/project/src/player_images
      sizeGB: 1